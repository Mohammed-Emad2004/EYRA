name: eyra
description: "Eyra - Assistive smart-glasses companion app for visually impaired users."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  camera: ^0.11.0+2
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  battery_plus: ^6.2.1
  cloud_firestore: ^6.9.0
  speech_to_text: ^7.2.0
  flutter_tts: ^4.2.2
  http: ^1.2.2
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/eyra_logo.png
